name: CI

on:
  # Branches are covered by the pull_request trigger; push only runs for main.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"

# A newer push to the same PR/branch supersedes the run in flight (never cancel main).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # Draft PRs skip CI until marked ready for review.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # recommended for GitHub-hosted runners: keep source-built wheels,
          # drop pre-built ones before the cache is saved
          prune-cache: true

      - name: Install dev tooling
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test
        run: uv run python -m unittest discover -s tests -t . --verbose

      - name: Build the demo
        run: uv run python demo/build.py
