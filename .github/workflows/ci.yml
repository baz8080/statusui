name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # recommended for GitHub-hosted runners: keep source-built wheels,
          # drop pre-built ones before the cache is saved
          prune-cache: true

      - name: Install dev tooling
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check

      # without node, TestMirror and TestFreshness skip rather than fail
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Test
        run: uv run python -m unittest discover -s tests -t . --verbose

      - name: Build the demo
        run: uv run python demo/build.py
