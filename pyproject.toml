# Not a package: the consumers vendor ui/ by file copy (see sync.sh). This file
# exists for ruff, whose target tracks the consumers' Python 3.9 floor.
[project]
name = "statusui"
version = "0.1.0"
description = "The shared design layer of the uisce, esb and lifts status sites"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
