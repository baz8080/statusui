# Installed by the consumers as a uv git dependency pinned in their uv.lock;
# rollout.sh moves the pins. ruff's target tracks the consumers' Python floor.
[project]
name = "statusui"
version = "0.1.0"
description = "The shared design layer of the uisce, esb and lifts status sites"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
